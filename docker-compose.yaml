services:
  # Backend Server API Service
  server:
    build:
      context: ./server
      dockerfile: Dockerfile.dev
    container_name: task_tracker_server
    restart: always
    ports:
      - "8080:8080"
    env_file:
      - path: ./server/.env
        required: true
    environment:
      - PORT=8080
    volumes:
      - ./server:/app
      - /app/node_modules

  # Frontend Client React Web App Service
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: task_tracker_client
    ports:
      - "5173:5173" # Vite default 5173 par chalta hai, Nginx 80 par tha
    depends_on:
      - server
    volumes:
      - ./client:/app
      - /app/node_modules

